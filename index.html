<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  :root { --bg:#12261f; --grid:#183229; --snake:#f2c94c; --head:#ffe79a; --food:#e8573d; --text:#e9f1ec; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:var(--bg); color:var(--text);
    font-family: Georgia, serif; touch-action:none;
  }
  h1 { margin:0; font-size:28px; font-weight:normal; letter-spacing:.5px; }
  #score { font-size:18px; }
  canvas { background:var(--grid); border-radius:10px; max-width:92vw; height:auto; }
  #pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,56px); gap:8px; }
  #pad button {
    border:none; border-radius:12px; background:#24473a; color:var(--text);
    font-size:24px; cursor:pointer;
  }
  #pad button:active { background:#2f5d4b; }
  #pad button:focus-visible, #start:focus-visible { outline:3px solid var(--snake); }
  #up { grid-column:2; grid-row:1; } #left { grid-column:1; grid-row:2; }
  #down { grid-column:2; grid-row:2; } #right { grid-column:3; grid-row:2; }
  #start {
    padding:10px 26px; border:none; border-radius:999px; background:var(--snake);
    color:#1b2a22; font-size:17px; font-family:inherit; cursor:pointer;
  }
</style>
</head>
<body>
  <h1>Snake</h1>
  <div id="score">Score: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <button id="start">Start game</button>
  <div id="pad">
    <button id="up" aria-label="Up">↑</button>
    <button id="left" aria-label="Left">←</button>
    <button id="down" aria-label="Down">↓</button>
    <button id="right" aria-label="Right">→</button>
  </div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const startBtn = document.getElementById("start");

const SIZE = 20;                    // each cell is 20x20 pixels
const CELLS = canvas.width / SIZE;  // 20 cells across and down

let snake, direction, nextDirection, food, score, timer, running;
let best = 0;                       // high score (resets when you reload the page)
let speed = 120;                    // milliseconds per step

function showScore() { scoreEl.textContent = "Score: " + score + "   Best: " + best; }

// Sound effects made with the browser's Web Audio API (no files needed)
let audio;
function beep(freq, length) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.frequency.value = freq;
    gain.gain.value = 0.08;
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + length);
  } catch (e) {}
}

// Restart the game loop at a new speed
function setSpeed(ms) {
  speed = ms;
  clearInterval(timer);
  timer = setInterval(tick, speed);
}

// 1. SETUP: put everything back to its starting state
function reset() {
  snake = [{x:10, y:10}, {x:9, y:10}, {x:8, y:10}]; // head is first
  direction = {x:1, y:0};
  nextDirection = direction;
  score = 0;
  showScore();
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random()*CELLS), y: Math.floor(Math.random()*CELLS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y)); // never inside the snake
}

// 2. UPDATE: move the game forward by one step
function update() {
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  snake.unshift(head);               // add new head
  if (head.x === food.x && head.y === food.y) {
    score++;                         // ate food: keep the tail so we grow
    if (score > best) best = score;
    showScore();
    beep(660, 0.08);
    setSpeed(Math.max(60, 120 - score * 4));  // faster with every apple, down to 60ms
    placeFood();
  } else {
    snake.pop();                     // no food: remove the tail
  }
}

// 3. DRAW: paint the current state on the canvas
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--food");
  ctx.beginPath();
  ctx.arc(food.x*SIZE + SIZE/2, food.y*SIZE + SIZE/2, SIZE/2 - 2, 0, Math.PI*2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#ffe79a" : "#f2c94c";
    ctx.fillRect(s.x*SIZE + 1, s.y*SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

// The game loop: update, then draw, over and over
function tick() { update(); if (running) draw(); }

function startGame() {
  clearInterval(timer);
  reset();
  running = true;
  startBtn.style.display = "none";
  draw();
  setSpeed(120);                     // lower number = faster game
}

function gameOver() {
  running = false;
  clearInterval(timer);
  beep(160, 0.4);
  startBtn.textContent = "Game over. Play again";
  startBtn.style.display = "block";
}

// 4. INPUT: change direction (can't reverse straight into yourself)
function turn(dx, dy) {
  if (dx === -direction.x && dy === -direction.y) return;
  nextDirection = {x:dx, y:dy};
}

document.addEventListener("keydown", e => {
  const keys = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
                 w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
  if (keys[e.key]) { e.preventDefault(); turn(...keys[e.key]); }
});
document.getElementById("up").onclick    = () => turn(0,-1);
document.getElementById("down").onclick  = () => turn(0,1);
document.getElementById("left").onclick  = () => turn(-1,0);
document.getElementById("right").onclick = () => turn(1,0);

// Swipe support for phones
let sx, sy;
canvas.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
canvas.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
});

startBtn.onclick = startGame;
reset(); draw();
</script>
</body>
</html>
