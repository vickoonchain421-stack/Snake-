<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake Quest</title>
<meta name="theme-color" content="#8fd3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --ink:#1d3b2a; --orange:#ff8a1f; --green:#2e9e4f; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:12px; color:var(--ink); font-family:Georgia, serif; touch-action:none;
    background:linear-gradient(#8fd3ff 0%, #d9f3ff 55%, #eaffd9 100%);
  }
  h1 { margin:0; font-size:28px; letter-spacing:.5px; }
  #hud { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px; width:min(92vw,440px); }
  #hud div { background:rgba(255,255,255,.85); border-radius:10px; padding:6px 4px; text-align:center; }
  #hud small { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px; opacity:.7; }
  #hud b { font-size:18px; }
  .stage { position:relative; width:min(92vw,440px); }
  canvas { width:100%; height:auto; display:block; border-radius:14px; box-shadow:0 10px 30px rgba(20,80,40,.35); }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:16px; text-align:center; overflow:auto; border-radius:14px;
    background:rgba(255,255,255,.85); backdrop-filter:blur(3px);
  }
  #overlay h2 { margin:0; font-size:28px; }
  #overlay p { margin:0; }
  .small { font-size:13px; opacity:.8; }
  .btn, .mode, #pause, .toggle {
    border:none; border-radius:999px; font-family:inherit; cursor:pointer; color:#fff;
    background:var(--orange); padding:11px 26px; font-size:17px;
  }
  .btn.alt { background:#4b6b5a; }
  .mode { width:100%; max-width:300px; border-radius:14px; background:var(--green); text-align:left; padding:9px 16px; }
  .mode b { display:block; font-size:17px; }
  .mode span { font-size:13px; opacity:.95; }
  .mode[data-mode="competitive"] { background:#c2410c; }
  #options { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px 14px; font-size:15px; width:min(92vw,440px); }
  #pause, .toggle { padding:8px 14px; font-size:14px; background:#24473a; }
  .toggle.off { background:#8a8f8c; }
  .stepper { display:flex; align-items:center; gap:12px; }
  .step { width:36px; height:36px; border-radius:50%; border:none; background:#24473a; color:#fff; font-size:20px; cursor:pointer; }
  #popup { position:absolute; left:0; right:0; top:34%; text-align:center; pointer-events:none; z-index:5; opacity:0;
    font-size:46px; font-weight:bold; color:#fff; text-shadow:0 3px 0 #c2410c, 0 0 18px rgba(255,200,0,.95); }
  #popup.show { animation:pop 1.2s ease-out; }
  @keyframes pop { 0% { opacity:0; transform:scale(.4); } 20% { opacity:1; transform:scale(1.15); } 70% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:translateY(-30px); } }
  #pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,52px); gap:8px; }
  #pad button { border:none; border-radius:12px; background:#24473a; color:#fff; font-size:24px; cursor:pointer; }
  #pad button:active { background:#2f6a52; }
  button:focus-visible { outline:3px solid #1d6fd8; }
  #up { grid-column:2; grid-row:1; } #left { grid-column:1; grid-row:2; }
  #down { grid-column:2; grid-row:2; } #right { grid-column:3; grid-row:2; }
</style>
</head>
<body>
  <h1>Snake Quest</h1>

  <div id="hud">
    <div><small>Level</small><b id="hLevel">1</b></div>
    <div><small>Score</small><b id="hScore">0</b></div>
    <div><small>Best</small><b id="hBest">0</b></div>
    <div><small>Apples</small><b id="hApples">0</b></div>
    <div id="hExtra" hidden><small>Time</small><b id="hTime">0</b></div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div id="overlay" hidden></div>
    <div id="popup"></div>
  </div>

  <div id="options">
    <button id="pause">Pause</button>
    <button class="toggle" id="musicBtn">🎵 Music: On</button>
    <button class="toggle" id="fxBtn">🔊 Voice &amp; FX: On</button>
    <label><input type="checkbox" id="wrap"> Wrap through walls</label>
  </div>

  <div id="pad">
    <button id="up" aria-label="Up">↑</button>
    <button id="left" aria-label="Left">←</button>
    <button id="down" aria-label="Down">↓</button>
    <button id="right" aria-label="Right">→</button>
  </div>

<script>
// ================= SETTINGS =================
const S = 22, N = 20, W = S * N;               // cell size, grid size, canvas size
const canvas = document.getElementById("game");
canvas.width = canvas.height = W;
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);
const overlay = $("overlay"), pauseBtn = $("pause"), wrapEl = $("wrap");

// base = start speed (ms per step, lower is faster), perLevel = speed gained each level,
// min = fastest allowed, goalBase = apples needed on level 1, extraRocks = random rocks added
const MODES = {
  normal:      { name:"Normal",      desc:"Steady speed. Rocks appear from level 2.", base:150, perLevel:7, min:70, goalBase:5, extraRocks:0 },
  hard:        { name:"Hard",        desc:"Faster snake and extra rocks from level 1.", base:115, perLevel:7, min:55, goalBase:6, extraRocks:4 },
  fast:        { name:"Fast",        desc:"Lightning speed. Quick reflexes needed.",   base:80,  perLevel:3, min:45, goalBase:5, extraRocks:0 },
  competitive: { name:"Competitive", desc:"Timed levels, combos, golden apples and a top-5 board.", base:110, perLevel:6, min:50, goalBase:6, extraRocks:2, timed:true }
};

// ================= SAVED SCORES =================
function loadJSON(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; } }
function saveJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
let bests = loadJSON("snakeQuestBests", {});
let board = loadJSON("snakeQuestBoard", []);

// ================= STATE =================
let modeKey, mode, level, score, snake, direction, nextDirection, food, bonus, rocks;
let applesThisLevel, goal, combo, lastEat, clock, timeLeft, timer, speed, state = "menu";
let reach = [], startLevel = 1, ranked = true, recordSet = false;

// ================= SOUND =================
const soundPrefs = loadJSON("snakeQuestSound", { music: true, fx: true });
let musicOn = soundPrefs.music !== false, fxOn = soundPrefs.fx !== false;
function saveSound() { saveJSON("snakeQuestSound", { music: musicOn, fx: fxOn }); }

let audio;
function getAudio() {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
  return audio;
}

// Short sound effects
function beep(freq, length, delay = 0) {
  if (!fxOn) return;
  setTimeout(() => {
    try {
      const a = getAudio(), osc = a.createOscillator(), gain = a.createGain();
      osc.frequency.value = freq; gain.gain.value = 0.07;
      osc.connect(gain); gain.connect(a.destination);
      osc.start(); osc.stop(a.currentTime + length);
    } catch (e) {}
  }, delay);
}

// Voice praise (uses the phone's built-in voice) plus a pop-up word on screen
const PRAISE = ["Bravo!", "Brilliant!", "Awesome!", "Well done!", "Incredible!"];
function speak(text) {
  if (!fxOn || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function praise(text) {
  text = text || PRAISE[Math.floor(Math.random() * PRAISE.length)];
  const p = document.getElementById("popup");
  p.textContent = text; p.classList.remove("show"); void p.offsetWidth; p.classList.add("show");
  [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.14, i * 90));
  speak(text);
}

// Background music: a cheerful looping tune made from code, so no audio file is needed
const music = (() => {
  const STEP = 60 / 112 / 2;                                          // one eighth note at 112 BPM
  const chords = [[72,76,79], [69,72,76], [69,72,77], [71,74,79]];    // C, Am, F, G
  const bass = [48, 45, 41, 43];
  const arp = [0, 1, 2, 1, 0, 2, 1, 2];
  let bus, timer = null, next = 0, step = 0;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(m, t, dur, type, vol) {
    const a = getAudio(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
  }
  function playStep(s, t) {
    const bar = Math.floor(s / 8) % 4, pos = s % 8, ch = chords[bar];
    if (pos === 0 || pos === 4) tone(bass[bar], t, STEP * 3.6, "triangle", 0.5);
    if (pos === 0) tone(ch[0] - 12, t, STEP * 7.5, "sine", 0.18);
    tone(ch[arp[pos]], t, STEP * 1.6, "triangle", 0.22);
    if (pos % 2 === 1) tone(112, t, 0.04, "square", 0.03);
  }
  function schedule() {
    const a = getAudio();
    while (next < a.currentTime + 0.35) { playStep(step, next); next += STEP; step++; }
  }
  function start() {
    if (!musicOn || timer) return;
    try {
      const a = getAudio();
      if (!bus) { bus = a.createGain(); bus.gain.value = 0.35; bus.connect(a.destination); }
      next = a.currentTime + 0.1;
      timer = setInterval(schedule, 100);
    } catch (e) {}
  }
  function stop() { clearInterval(timer); timer = null; }
  return { start, stop };
})();

// ================= LEVELS (rock layouts) =================
function rect(x1, y1, x2, y2) {
  const cells = [];
  for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) cells.push([x, y]);
  return cells;
}
const LAYOUTS = [
  () => [],                                                                           // 1: open field
  () => [...rect(3,3,4,4), ...rect(15,3,16,4), ...rect(3,15,4,16), ...rect(15,15,16,16)], // 2: corner rocks
  () => [...rect(6,2,6,7), ...rect(6,12,6,17), ...rect(13,2,13,7), ...rect(13,12,13,17)], // 3: pillars
  () => [...rect(3,5,16,5), ...rect(3,14,16,14)],                                      // 4: two walls
  () => { const c = []; for (let i = 3; i <= 16; i++) c.push([i,i], [i,19-i]); return c; }, // 5: big X
  () => { const c = []; for (let i = 5; i <= 14; i++) if (i !== 9 && i !== 10) c.push([i,5],[i,14],[5,i],[14,i]); return c; }, // 6: ring
  () => { const c = []; [4,8,12,16].forEach((x,k) => { for (let y = 0; y < N; y++) { const gap = k % 2 === 0 ? (y >= 1 && y <= 3) : (y >= 16 && y <= 18); if (!gap) c.push([x,y]); } }); return c; }, // 7: zigzag
  () => { const c = []; for (let x = 1; x < N; x += 3) for (let y = 1; y < N; y += 3) c.push([x,y]); return c; }, // 8: stone field
  () => [...LAYOUTS[4](), ...LAYOUTS[1]()],                                            // 9: X and corners
  () => { const c = []; for (let i = 2; i <= 17; i++) if (i !== 9 && i !== 10) c.push([i,6],[i,13],[6,i],[13,i]); return c; }, // 10: crossroads
  () => ring(2,2,17,17),                                                              // 11: big fence
  () => [...ring(2,2,17,17), ...ring(6,6,13,13)],                                      // 12: fence in a fence
  () => { const c = []; [4,8,12,16].forEach((y,k) => { for (let x = 0; x < N; x++) { const gap = k % 2 === 0 ? (x >= 1 && x <= 3) : (x >= 16 && x <= 18); if (!gap) c.push([x,y]); } }); return c; }, // 13: sideways zigzag
  () => [...plus(4,4,2), ...plus(15,4,2), ...plus(4,15,2), ...plus(15,15,2), ...plus(10,10,2)], // 14: crosses
  () => [...LAYOUTS[9](), ...LAYOUTS[1]()]                                             // 15: final boss
];
// a square fence with a 2-cell gap in the middle of each side
function ring(x1, y1, x2, y2) {
  const c = [], mx = (x1 + x2) >> 1, my = (y1 + y2) >> 1;
  for (let i = x1; i <= x2; i++) if (i !== mx && i !== mx + 1) c.push([i,y1], [i,y2]);
  for (let j = y1; j <= y2; j++) if (j !== my && j !== my + 1) c.push([x1,j], [x2,j]);
  return c;
}
function plus(cx, cy, r) {
  const c = [[cx, cy]];
  for (let i = 1; i <= r; i++) c.push([cx+i,cy], [cx-i,cy], [cx,cy+i], [cx,cy-i]);
  return c;
}

function buildRocks() {
  const inStartZone = (x, y) => x <= 9 && y >= 8 && y <= 12;   // keep the start path clear
  let cells = LAYOUTS[(level - 1) % LAYOUTS.length]().filter(([x, y]) => !inStartZone(x, y));
  const set = new Set(cells.map(([x, y]) => x + "," + y));
  // after level 15 the layouts repeat, with more random rocks each level
  let extra = mode.extraRocks + (level > 15 ? Math.min(10, level - 15) : 0);
  let tries = 0;
  while (extra > 0 && tries++ < 300) {
    const x = 1 + Math.floor(Math.random() * (N - 2)), y = 1 + Math.floor(Math.random() * (N - 2));
    if (inStartZone(x, y) || set.has(x + "," + y)) continue;
    set.add(x + "," + y); extra--;
  }
  rocks = set;
  computeReach();
}

// Find every cell the snake can actually get to, so food never appears in a sealed-off pocket
function computeReach() {
  const seen = new Set(["5,10"]), stack = [[5, 10]];
  while (stack.length) {
    const [x, y] = stack.pop();
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy, k = nx + "," + ny;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N || rocks.has(k) || seen.has(k)) return;
      seen.add(k); stack.push([nx, ny]);
    });
  }
  reach = [...seen].map(k => { const [x, y] = k.split(",").map(Number); return { x, y }; });
}

// ================= HELPERS =================
const randInt = n => Math.floor(Math.random() * n);
function occupied(p) {
  return rocks.has(p.x + "," + p.y) || snake.some(s => s.x === p.x && s.y === p.y) ||
         (food && food.x === p.x && food.y === p.y) || (bonus && bonus.x === p.x && bonus.y === p.y);
}
function freeCell() {
  for (let i = 0; i < 300; i++) {
    const p = reach[randInt(reach.length)];
    if (!occupied(p)) return { x: p.x, y: p.y };
  }
  const free = reach.filter(p => !occupied(p));
  const p = free.length ? free[0] : reach[0];
  return { x: p.x, y: p.y };
}
function calcInterval() {
  return Math.max(mode.min, mode.base - (level - 1) * mode.perLevel - applesThisLevel * 2);
}
function updateBest() {
  if (!ranked) return;                       // practice runs don't count
  const old = bests[modeKey] || 0;
  if (score > old) { if (old > 0) recordSet = true; bests[modeKey] = score; saveJSON("snakeQuestBests", bests); }
}
function hud() {
  $("hLevel").textContent = level;
  $("hScore").textContent = score;
  $("hBest").textContent = bests[modeKey] || 0;
  $("hApples").textContent = applesThisLevel + "/" + goal;
  $("hExtra").hidden = !mode.timed;
  if (mode.timed) $("hTime").textContent = Math.max(0, Math.ceil(timeLeft / 1000)) + "s" + (combo > 1 ? " ×" + combo : "");
}
function showOverlay(html) { overlay.innerHTML = html; overlay.hidden = false; }
function hideOverlay() { overlay.hidden = true; }

// ================= GAME FLOW =================
function showMenu() {
  clearInterval(timer); music.stop();
  state = "menu"; snake = null;
  pauseBtn.textContent = "Pause";
  draw();
  let html = `<h2>Snake Quest</h2>
    <div class="stepper"><button class="step" id="lvDown" aria-label="Lower start level">−</button><span>Start at level <b id="lvNum">${startLevel}</b></span><button class="step" id="lvUp" aria-label="Higher start level">+</button></div>
    <p class="small" id="lvNote">${startLevel > 1 ? "Practice start: scores are not saved." : "Choose a mode"}</p>`;
  Object.entries(MODES).forEach(([k, m]) => {
    html += `<button class="mode" data-mode="${k}"><b>${m.name}</b><span>${m.desc}</span></button>`;
  });
  if (board.length) html += `<p class="small">Competitive top scores: ${board.map(b => b.score).join(" · ")}</p>`;
  showOverlay(html);
  overlay.querySelectorAll(".mode").forEach(b => b.onclick = () => startGame(b.dataset.mode));
  const setLv = v => {
    startLevel = Math.max(1, Math.min(20, v));
    $("lvNum").textContent = startLevel;
    $("lvNote").textContent = startLevel > 1 ? "Practice start: scores are not saved." : "Choose a mode";
  };
  $("lvDown").onclick = () => setLv(startLevel - 1);
  $("lvUp").onclick = () => setLv(startLevel + 1);
}

function startGame(key) {
  modeKey = key; mode = MODES[key];
  level = startLevel; score = 0; clock = 0;
  ranked = startLevel === 1; recordSet = false;
  prepareLevel("");
}

function prepareLevel(message) {
  clearInterval(timer); music.stop();
  goal = Math.min(15, mode.goalBase + level - 1);
  buildRocks();
  snake = [{ x:5, y:10 }, { x:4, y:10 }, { x:3, y:10 }];
  direction = nextDirection = { x:1, y:0 };
  food = null; bonus = null;
  food = freeCell();
  applesThisLevel = 0; combo = 1; lastEat = -99999;
  timeLeft = 30000 + goal * 2500;
  speed = calcInterval();
  state = "ready";
  pauseBtn.textContent = "Pause";
  hud(); draw();
  const timeText = mode.timed ? ` in ${Math.round(timeLeft / 1000)} seconds` : "";
  showOverlay(`<h2>Level ${level}</h2>${message ? `<p>${message}</p>` : ""}<p>Eat ${goal} apples${timeText}.</p><button class="btn" id="go">Go!</button>`);
  $("go").onclick = begin;
}

function begin() {
  hideOverlay();
  state = "play";
  setSpeed(speed);
  music.start();
}

function setSpeed(ms) {
  speed = ms;
  clearInterval(timer);
  timer = setInterval(tick, speed);
}

function tick() {
  update();
  if (state === "play") draw();
}

// ================= UPDATE =================
function update() {
  clock += speed;
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
  if (wrapEl.checked) { head.x = (head.x + N) % N; head.y = (head.y + N) % N; }

  const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
  if (hitWall || rocks.has(head.x + "," + head.y)) return gameOver(hitWall ? "Hit the wall!" : "Hit a rock!");
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver("You bit yourself!");

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    applesThisLevel++;
    const prevCombo = combo;
    combo = mode.timed && clock - lastEat <= 4000 ? Math.min(5, combo + 1) : 1;
    lastEat = clock;
    score += 10 * level * (mode.timed ? combo : 1);
    updateBest();
    beep(660, 0.08);
    if (mode.timed && combo === 5 && prevCombo < 5) praise();   // combo jackpot
    food = null; food = freeCell();
    if (applesThisLevel >= goal) return levelComplete();
    // a golden apple shows up every few apples (every 3 in Competitive, every 4 elsewhere)
    if (applesThisLevel % (mode.timed ? 3 : 4) === 0 && !bonus) { bonus = freeCell(); bonus.expires = clock + 7000; }
    setSpeed(calcInterval());
  } else if (bonus && head.x === bonus.x && head.y === bonus.y) {
    score += 50 * level;
    if (mode.timed) timeLeft += 3000;
    updateBest();
    bonus = null;
    praise();                                    // golden apple jackpot
  } else {
    snake.pop();
  }

  if (bonus && clock > bonus.expires) bonus = null;
  if (mode.timed) {
    timeLeft -= speed;
    if (timeLeft <= 0) { timeLeft = 0; hud(); return gameOver("Time's up!"); }
  }
  hud();
}

function levelComplete() {
  clearInterval(timer);
  const bonusPoints = level * 50 + (mode.timed ? Math.floor(timeLeft / 1000) * 5 : 0);
  score += bonusPoints;
  updateBest();
  praise();
  const done = level;
  level++;
  prepareLevel(`Level ${done} complete! Bonus +${bonusPoints}`);
}

function gameOver(reason) {
  clearInterval(timer);
  state = "over";
  music.stop();
  beep(160, 0.4);
  if (ranked && mode.timed && score > 0) {
    board.push({ score, level });
    board.sort((a, b) => b.score - a.score);
    board = board.slice(0, 5);
    saveJSON("snakeQuestBoard", board);
  }
  hud(); draw();
  const lb = mode.timed && board.length ? `<p class="small">Top scores: ${board.map(b => b.score).join(" · ")}</p>` : "";
  showOverlay(`<h2>${reason}</h2><p>Level ${level} · Score ${score}</p><p>Best in ${mode.name}: ${bests[modeKey] || 0}</p>${recordSet ? "<p><b>New best score!</b></p>" : ""}${ranked ? "" : '<p class="small">Practice run: scores not saved.</p>'}${lb}
    <button class="btn" id="again">Play again</button><button class="btn alt" id="menu">Change mode</button>`);
  $("again").onclick = () => startGame(modeKey);
  $("menu").onclick = showMenu;
  if (recordSet) praise("Brilliant!");
}

function togglePause() {
  if (state === "play") {
    state = "paused"; clearInterval(timer); music.stop(); pauseBtn.textContent = "Resume"; draw();
  } else if (state === "paused") {
    state = "play"; pauseBtn.textContent = "Pause"; setSpeed(speed); music.start();
  }
}

// ================= DRAWING =================
// The grass is painted once into a hidden canvas, then copied every frame.
const bg = document.createElement("canvas");
bg.width = bg.height = W;
(function paintBackground() {
  const g = bg.getContext("2d");
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    g.fillStyle = (x + y) % 2 ? "#a8e866" : "#9ddd58";
    g.fillRect(x * S, y * S, S, S);
  }
  const light = g.createRadialGradient(W * .4, W * .3, 10, W / 2, W / 2, W * .75);
  light.addColorStop(0, "rgba(255,255,220,.30)"); light.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = light; g.fillRect(0, 0, W, W);
  g.lineWidth = 1.2; g.lineCap = "round";
  for (let i = 0; i < 150; i++) {          // little grass blades
    const x = rnd() * W, y = rnd() * W;
    g.strokeStyle = rnd() > .5 ? "rgba(60,140,40,.35)" : "rgba(255,255,255,.28)";
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2, y - 5); g.moveTo(x, y); g.lineTo(x + 2, y - 6); g.stroke();
  }
  const petals = ["#ffffff", "#ffe066", "#ff9ecb"];
  for (let i = 0; i < 14; i++) {           // tiny flowers
    const x = rnd() * W, y = rnd() * W;
    g.fillStyle = petals[i % 3]; g.beginPath(); g.arc(x, y, 2.4, 0, 7); g.fill();
    g.fillStyle = "#f5a300"; g.beginPath(); g.arc(x, y, 0.9, 0, 7); g.fill();
  }
  g.strokeStyle = "#4f9f3a"; g.lineWidth = 6; g.strokeRect(0, 0, W, W);
})();

function drawRock(x, y) {
  const cx = x * S + S / 2, cy = y * S + S / 2, v = (x * 7 + y * 13) % 3;
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(cx + 2, cy + S * .36, S * .46, S * .17, 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(cx - S * .15, cy - S * .2, S * .05, cx, cy, S * .6);
  g.addColorStop(0, ["#f1f2f3", "#ece7df", "#e3e8ee"][v]);
  g.addColorStop(1, ["#8d949a", "#8f877b", "#7f8a98"][v]);
  ctx.fillStyle = g; ctx.strokeStyle = "rgba(60,65,70,.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(cx, cy, S * .5, S * .45, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.ellipse(cx - S * .15, cy - S * .17, S * .14, S * .08, -.5, 0, 7); ctx.fill();
}

function drawApple(x, y, gold) {
  const cx = x * S + S / 2, cy = y * S + S / 2;
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(cx + 1, cy + S * .38, S * .3, S * .1, 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(cx - S * .12, cy - S * .15, 2, cx, cy, S * .45);
  g.addColorStop(0, gold ? "#fff3b0" : "#ff8a7a"); g.addColorStop(1, gold ? "#e0a000" : "#c4271d");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy + 1, S * .38, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.beginPath(); ctx.ellipse(cx - S * .14, cy - S * .1, S * .08, S * .13, .5, 0, 7); ctx.fill();
  ctx.strokeStyle = "#6b4226"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx, cy - S * .3); ctx.lineTo(cx + 2, cy - S * .5); ctx.stroke();
  ctx.fillStyle = "#3aa64a";
  ctx.beginPath(); ctx.ellipse(cx + S * .18, cy - S * .4, S * .17, S * .08, -.5, 0, 7); ctx.fill();
}

function strokeSnake(width, color, ox, oy) {
  ctx.lineWidth = width; ctx.strokeStyle = color; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  snake.forEach((s, i) => {
    const px = s.x * S + S / 2 + ox, py = s.y * S + S / 2 + oy, prev = snake[i - 1];
    if (i === 0 || Math.abs(s.x - prev.x) > 1 || Math.abs(s.y - prev.y) > 1) { ctx.moveTo(px, py); ctx.lineTo(px, py); }
    else ctx.lineTo(px, py);
  });
  ctx.stroke();
}

function drawSnake() {
  strokeSnake(S - 3, "rgba(0,0,0,.2)", 2, 3);     // shadow
  strokeSnake(S - 3, "#e8861b", 0, 0);            // body
  strokeSnake(S * .5, "#ffc25e", 0, -1);          // lighter back stripe
  ctx.fillStyle = "rgba(120,55,10,.55)";          // spots
  snake.forEach((s, i) => {
    if (i > 0 && i % 2 === 0) { ctx.beginPath(); ctx.arc(s.x * S + S / 2, s.y * S + S / 2, S * .15, 0, 7); ctx.fill(); }
  });
  const h = snake[0], hx = h.x * S + S / 2, hy = h.y * S + S / 2, dx = direction.x, dy = direction.y;
  ctx.strokeStyle = "#e0245e"; ctx.lineWidth = 2;  // tongue
  ctx.beginPath();
  ctx.moveTo(hx + dx * S * .5, hy + dy * S * .5); ctx.lineTo(hx + dx * S * .85, hy + dy * S * .85);
  ctx.moveTo(hx + dx * S * .85, hy + dy * S * .85); ctx.lineTo(hx + dx * S * 1.0 - dy * 3, hy + dy * S * 1.0 + dx * 3);
  ctx.moveTo(hx + dx * S * .85, hy + dy * S * .85); ctx.lineTo(hx + dx * S * 1.0 + dy * 3, hy + dy * S * 1.0 - dx * 3);
  ctx.stroke();
  const hg = ctx.createRadialGradient(hx - 2, hy - 3, 2, hx, hy, S * .6);
  hg.addColorStop(0, "#f59a2c"); hg.addColorStop(1, "#cf6f0c");
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(hx, hy, S * .56, 0, 7); ctx.fill();
  [-1, 1].forEach(side => {                       // eyes
    const ex = hx + dx * S * .15 + (-dy) * side * S * .22, ey = hy + dy * S * .15 + dx * side * S * .22;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, S * .17, 0, 7); ctx.fill();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(ex + dx * 1.5, ey + dy * 1.5, S * .08, 0, 7); ctx.fill();
  });
}

function draw() {
  ctx.drawImage(bg, 0, 0);
  if (!snake) return;
  rocks.forEach(k => { const [x, y] = k.split(",").map(Number); drawRock(x, y); });
  if (food) drawApple(food.x, food.y, false);
  if (bonus && !(bonus.expires - clock < 2000 && Math.floor(clock / 200) % 2)) drawApple(bonus.x, bonus.y, true);
  drawSnake();
  if (state === "paused") {
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.fillRect(0, 0, W, W);
    ctx.fillStyle = "#1d3b2a"; ctx.font = "bold 36px Georgia"; ctx.textAlign = "center";
    ctx.fillText("Paused", W / 2, W / 2);
  }
}

// ================= INPUT =================
function turn(dx, dy) {
  if (state !== "play") return;
  if (dx === -direction.x && dy === -direction.y) return;   // can't reverse into yourself
  nextDirection = { x: dx, y: dy };
}
document.addEventListener("keydown", e => {
  const keys = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
  if (keys[e.key]) { e.preventDefault(); turn(...keys[e.key]); return; }
  if (e.key === "Enter" && !overlay.hidden) { const b = overlay.querySelector("button"); if (b) b.click(); return; }
  if ((e.key === " " || e.key === "p") && overlay.hidden) { e.preventDefault(); togglePause(); }
});
$("up").onclick = () => turn(0, -1);
$("down").onclick = () => turn(0, 1);
$("left").onclick = () => turn(-1, 0);
$("right").onclick = () => turn(1, 0);
pauseBtn.onclick = togglePause;

let sx, sy;                                      // swipe on phones
canvas.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
canvas.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
});

function syncToggles() {
  $("musicBtn").textContent = "🎵 Music: " + (musicOn ? "On" : "Off");
  $("fxBtn").textContent = "🔊 Voice & FX: " + (fxOn ? "On" : "Off");
  $("musicBtn").classList.toggle("off", !musicOn);
  $("fxBtn").classList.toggle("off", !fxOn);
}
$("musicBtn").onclick = () => {
  musicOn = !musicOn; saveSound(); syncToggles();
  if (!musicOn) music.stop(); else if (state === "play") music.start();
};
$("fxBtn").onclick = () => {
  fxOn = !fxOn; saveSound(); syncToggles();
  if (!fxOn && "speechSynthesis" in window) speechSynthesis.cancel();
};
// auto-pause when you switch apps or tabs
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") togglePause(); });

// ================= START =================
mode = MODES.normal; modeKey = "normal"; level = 1; score = 0; goal = 5; applesThisLevel = 0;
syncToggles();
showMenu();

// Offline support: the service worker saves the game files so it works without internet
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
